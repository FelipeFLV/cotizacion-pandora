<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://zvusvaotqtchaglwyifl.supabase.co; img-src 'self' data: https://zvusvaotqtchaglwyifl.supabase.co https://i.ytimg.com; media-src 'self' https://zvusvaotqtchaglwyifl.supabase.co; frame-src 'self' https://www.youtube-nocookie.com https://player.vimeo.com; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Panel de cotizaciones · Pandora</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="admin-bar">
  <div class="admin-brand">
    <span class="admin-mark" aria-hidden="true">P</span>
    <span class="admin-name">Pandora</span>
    <span class="admin-sep" aria-hidden="true"></span>
    <span class="admin-title">Cotizaciones</span>
  </div>
  <div class="admin-actions">
    <button class="admin-ghost" id="import-open" type="button" hidden>Importar respaldo</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <span class="admin-user" id="who"></span>
    <button class="admin-signout" id="signout" type="button" hidden>Salir</button>
  </div>
</header>

<section class="admin-login" id="login">
  <p class="admin-kicker">Acceso privado</p>
  <h1>Entra con tu correo</h1>
  <p class="admin-lead">Te enviamos un enlace de un solo uso. Ábrelo en este mismo navegador.</p>
  <form id="login-form" novalidate>
    <label for="email">Correo autorizado</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <button type="submit">Enviar enlace</button>
  </form>
  <p class="admin-status" id="login-status" role="status" hidden></p>
</section>

<main class="admin-shell" id="panel" hidden>
  <aside class="admin-side">
    <div class="side-head">
      <input id="search" type="search" placeholder="Buscar cliente" aria-label="Buscar cliente">
    </div>
    <div class="filters" id="filters"></div>
    <div class="quote-list" id="quote-list"></div>
    <p class="side-foot" id="list-count"></p>
  </aside>
  <section class="admin-editor" id="editor"></section>
</main>

<p class="admin-toast" id="toast" role="status" hidden></p>

<div class="preview-layer" id="preview-layer" hidden>
  <header class="preview-bar">
    <span class="preview-title" id="preview-title">Vista previa</span>
    <div class="preview-actions">
      <button class="mini" id="preview-print" type="button">Imprimir / PDF</button>
      <button class="mini" id="preview-close" type="button">Cerrar</button>
    </div>
  </header>
  <iframe id="preview-frame" title="Vista previa de la cotización" src="about:blank"></iframe>
</div>

<script src="vendor/supabase.js"></script>
<script src="../app/core.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="model.js"></script>
<script src="api.js"></script>
<script src="library.js"></script>
<script src="editor-model.js"></script>
<script src="form.js"></script>
<script src="media.js"></script>
<script src="evidence.js"></script>
<script src="editor.js"></script>
<script src="model-media.js"></script>
<script src="app.js"></script>
</body>
</html>
