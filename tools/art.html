<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pandora — generador de piezas</title>
<link rel="stylesheet" href="../assets/fonts.css">
<style>
  :root{
    --ink:#28363B; --paper:#F8F7FA; --purple:#4600BB;
    --mint:#BFE0C8; --sky:#BFD3EA; --sand:#E6CBA6; --lilac:#CBB8F0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:relative;overflow:hidden}
  .serif{font-family:'Newsreader',serif;font-weight:400;letter-spacing:-.02em;line-height:.9}
  .it{font-style:italic}
  .lbl{font-size:19px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
  .tiny{font-size:15px;letter-spacing:.04em;line-height:1.5}
  .star{display:inline-block;width:1em;height:1em;background:currentColor;
    -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0z'/></svg>") center/contain no-repeat;
    mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 0c.6 6.2 5.8 11.4 12 12-6.2.6-11.4 5.8-12 12-.6-6.2-5.8-11.4-12-12C6.2 11.4 11.4 6.2 12 0z'/></svg>") center/contain no-repeat;
  }

  /* ---------- stills 1080x1350 ---------- */
  .art{width:1080px;height:1350px;position:relative;overflow:hidden;padding:76px;display:flex;flex-direction:column}
  .art .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}

  /* 1 Luz */
  .a-luz{background:linear-gradient(155deg,#16252B 0%,#28363B 55%,#1B2A30 100%);color:var(--paper)}
  .a-luz:before{content:"";position:absolute;width:900px;height:900px;right:-340px;top:-300px;border-radius:50%;
    background:radial-gradient(circle,rgba(191,224,200,.55),rgba(191,224,200,0) 65%)}
  .a-luz:after{content:"";position:absolute;inset:0;
    background:radial-gradient(ellipse at 8% 92%,rgba(230,203,166,.28),transparent 52%)}
  .a-luz .big{position:relative;font-size:260px;margin-top:auto;z-index:2;padding-bottom:10px}
  .a-luz .perf{position:absolute;left:26px;top:0;bottom:0;width:10px;display:flex;flex-direction:column;justify-content:space-around;z-index:2}
  .a-luz .perf i{display:block;width:10px;height:26px;border-radius:5px;background:rgba(248,247,250,.28)}
  .a-luz .meta{position:relative;z-index:2;display:flex;justify-content:space-between;font-size:17px;letter-spacing:.12em;text-transform:uppercase;border-top:1px solid rgba(248,247,250,.25);padding-top:26px;margin-top:34px}

  /* 2 Movimiento */
  .a-mov{background:var(--paper);color:var(--ink)}
  .a-mov .blob{position:absolute;width:620px;height:760px;right:-60px;top:150px;border-radius:50% 50% 44% 56%/58% 46% 54% 42%;
    background:linear-gradient(150deg,var(--mint),var(--lilac) 45%,var(--purple));filter:blur(2px);opacity:.92}
  .a-mov .arch{position:absolute;left:76px;top:150px;width:470px;height:640px;border:1.5px solid rgba(40,54,59,.35);border-radius:235px 235px 0 0}
  .a-mov .big{position:relative;font-size:172px;margin-top:auto;z-index:3;width:760px}
  .a-mov .foot{border-top:1px solid rgba(40,54,59,.2);padding-top:26px}

  /* 3 Storyboard */
  .a-story{background:#1D2C32;color:var(--paper)}
  .a-story .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:110px}
  .a-story .fr{aspect-ratio:4/3;border-radius:6px;position:relative;overflow:hidden;padding:20px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
  .a-story .fr b{font-weight:500;font-size:17px;letter-spacing:.14em}
  .a-story .fr span{font-family:'Newsreader',serif;font-size:58px;line-height:.85}
  .a-story .fr:nth-child(1){background:linear-gradient(140deg,var(--sand),var(--paper))}
  .a-story .fr:nth-child(2){background:linear-gradient(140deg,var(--mint),var(--sky))}
  .a-story .fr:nth-child(3){background:linear-gradient(140deg,var(--sky),var(--lilac))}
  .a-story .fr:nth-child(4){background:linear-gradient(140deg,var(--lilac),var(--sand))}
  .a-story h2{font-size:60px;font-family:'Newsreader',serif;line-height:.95;max-width:640px}
  .a-story .foot{border-top:1px solid rgba(248,247,250,.22);padding-top:24px}

  /* 4 Monograma */
  .a-mono{background:var(--paper);color:var(--ink);align-items:center;justify-content:center}
  .a-mono .guides{position:absolute;inset:0;
    background-image:linear-gradient(rgba(40,54,59,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(40,54,59,.10) 1px,transparent 1px);
    background-size:60px 60px}
  .a-mono .circle{position:absolute;width:700px;height:700px;border:1px dashed rgba(70,0,187,.35);border-radius:50%}
  .a-mono .mark{position:relative;width:420px;height:420px;z-index:2}
  .a-mono .tag{position:absolute;bottom:76px;left:76px;right:76px;display:flex;justify-content:space-between;border-top:1px solid rgba(40,54,59,.2);padding-top:22px}

  /* 5 Paleta */
  .a-pal{color:var(--ink);background:linear-gradient(145deg,var(--mint) 0%,var(--sky) 42%,var(--sand) 100%)}
  .a-pal .big{font-size:250px;margin-top:auto;position:relative;z-index:2}
  .a-pal .sub{font-size:22px;letter-spacing:.5em;text-transform:uppercase;margin-top:26px;position:relative;z-index:2}
  .a-pal .chips{display:flex;gap:10px;margin-top:46px;position:relative;z-index:2}
  .a-pal .chip{flex:1;height:120px;border-radius:4px;background:rgba(248,247,250,.55);backdrop-filter:blur(4px);padding:14px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;letter-spacing:.08em}
  .a-pal .chip i{display:block;width:26px;height:26px;border-radius:50%;margin-bottom:auto}

  /* 6 Papelería */
  .a-stat{background:var(--sand);color:var(--ink);justify-content:center;align-items:center}
  .a-stat .card{position:absolute;background:var(--paper);border-radius:3px;box-shadow:0 26px 60px rgba(40,54,59,.16)}
  .a-stat .c1{width:620px;height:380px;transform:rotate(-6deg);left:110px;top:380px;padding:44px;display:flex;flex-direction:column;justify-content:space-between}
  .a-stat .c2{width:560px;height:330px;transform:rotate(4deg);right:110px;top:520px;padding:40px;display:flex;flex-direction:column;justify-content:flex-end;gap:18px}
  .a-stat .line{height:1px;background:rgba(40,54,59,.22)}
  .a-stat .bars span{display:block;height:7px;background:rgba(40,54,59,.13);margin-bottom:12px;border-radius:4px}

  /* 7 Póster Sur */
  .a-sur{background:var(--purple);color:var(--paper);justify-content:space-between}
  .a-sur .big{font-size:420px;line-height:.78;margin-left:-12px}
  .a-sur .row{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(248,247,250,.4);padding-top:28px}
  .a-sur .row p{max-width:420px;font-size:17px;line-height:1.55;opacity:.85}
  .a-sur .star{font-size:90px;position:absolute;right:70px;top:70px;color:var(--mint)}

  /* 8 Packaging */
  .a-pack{background:linear-gradient(160deg,#CFE6D6,#BFD3EA);color:var(--ink);align-items:center;justify-content:center}
  .a-pack .shelf{display:flex;align-items:flex-end;gap:34px;margin-top:60px}
  .a-pack .box{width:220px;background:var(--paper);border-radius:4px;box-shadow:0 30px 50px rgba(40,54,59,.18);position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:22px}
  .a-pack .box:after{content:"";position:absolute;left:0;top:0;bottom:0;width:26px;background:rgba(40,54,59,.10);border-radius:4px 0 0 4px}
  .a-pack .box b{font-weight:500;font-size:13px;letter-spacing:.14em}
  .a-pack .h1{height:420px}.a-pack .h2{height:340px}.a-pack .h3{height:390px}

  /* 9 Editorial */
  .a-edit{background:var(--paper);color:var(--ink)}
  .a-edit .top{display:flex;justify-content:space-between;border-bottom:1px solid rgba(40,54,59,.25);padding-bottom:20px}
  .a-edit h1{font-size:130px;line-height:.92;margin:56px 0 40px;max-width:820px}
  .a-edit .cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .a-edit .txt{background:repeating-linear-gradient(rgba(40,54,59,.22) 0 2px,transparent 2px 17px);height:320px}
  .a-edit .img{height:320px;border-radius:3px;background:linear-gradient(140deg,var(--sky),var(--purple));position:relative}
  .a-edit .img span{position:absolute;left:18px;bottom:16px;color:var(--paper);font-size:13px;letter-spacing:.1em}

  /* 10 Teléfonos */
  .a-phone{background:var(--paper);color:var(--ink);align-items:center;justify-content:center}
  .a-phone:before{content:"";position:absolute;width:760px;height:760px;border-radius:50%;background:radial-gradient(circle,rgba(203,184,240,.55),transparent 65%);left:-160px;top:120px}
  .a-phone .row{display:flex;gap:30px;align-items:center;position:relative;z-index:2}
  .a-phone .ph{width:250px;height:520px;border-radius:34px;background:#101B20;padding:9px;box-shadow:0 30px 60px rgba(40,54,59,.22)}
  .a-phone .scr{width:100%;height:100%;border-radius:26px;overflow:hidden;position:relative;background:var(--paper)}
  .a-phone .scr .img{height:62%;position:relative;display:flex;align-items:flex-end;padding:16px}
  .a-phone .scr .img b{font-family:'Newsreader',serif;font-size:30px;line-height:.95;color:var(--paper)}
  .a-phone .scr .body{padding:14px;display:flex;flex-direction:column;gap:7px}
  .a-phone .scr .body i{display:block;height:5px;border-radius:3px;background:rgba(40,54,59,.16)}
  .a-phone .ph:nth-child(2){transform:translateY(-40px) scale(1.04)}

  /* 11 Parrilla */
  .a-grid{background:#1D2C32;color:var(--paper);justify-content:center}
  .a-grid .g{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .a-grid .t{aspect-ratio:1;border-radius:3px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);overflow:hidden;position:relative}
  .a-grid .t span{font-family:'Newsreader',serif;font-size:40px;line-height:.85}
  .a-grid .t em{font-style:normal;font-size:12px;letter-spacing:.12em;text-transform:uppercase}

  /* 12 Reel */
  .a-reel{background:linear-gradient(150deg,#101B20,#28363B);color:var(--paper);align-items:center;justify-content:center}
  .a-reel .frame{width:520px;height:925px;border-radius:14px;overflow:hidden;position:relative;background:linear-gradient(170deg,var(--sand),var(--mint) 55%,var(--sky));display:flex;align-items:flex-end;padding:44px}
  .a-reel .frame h2{font-size:86px;line-height:.88;color:var(--ink)}
  .a-reel .play{position:absolute;top:44px;right:44px;width:74px;height:74px;border-radius:50%;background:rgba(248,247,250,.85);display:grid;place-items:center}
  .a-reel .play:after{content:"";border-left:18px solid var(--purple);border-top:12px solid transparent;border-bottom:12px solid transparent;margin-left:6px}
  .a-reel .cap{position:absolute;bottom:70px;left:0;right:0;text-align:center;font-size:15px;letter-spacing:.3em;text-transform:uppercase;opacity:.7}

  /* 13 Campañas */
  .a-camp{background:var(--paper);color:var(--ink)}
  .a-camp h2{font-size:92px;line-height:.95;max-width:700px;margin-top:40px}
  .a-camp .chart{display:flex;align-items:flex-end;gap:18px;height:430px;margin-top:60px;border-bottom:1px solid rgba(40,54,59,.3);padding-bottom:0}
  .a-camp .bar{flex:1;border-radius:6px 6px 0 0;position:relative}
  .a-camp .bar:nth-child(odd){background:var(--purple)}
  .a-camp .bar:nth-child(even){background:var(--mint)}
  .a-camp .bar:after{content:"";position:absolute;inset:auto 0 0 0;height:12px;background:rgba(248,247,250,.18)}
  .a-camp .scale{display:flex;justify-content:space-between;margin-top:16px;font-size:13px;letter-spacing:.1em;opacity:.7}

  /* 14 Anuncio */
  .a-ad{background:var(--sand);color:var(--ink);justify-content:center;align-items:center}
  .a-ad .post{width:660px;background:var(--paper);border-radius:6px;box-shadow:0 40px 80px rgba(40,54,59,.22);overflow:hidden}
  .a-ad .head{display:flex;align-items:center;gap:14px;padding:20px}
  .a-ad .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(140deg,var(--mint),var(--purple))}
  .a-ad .meta b{display:block;font-size:15px}.a-ad .meta span{font-size:12px;opacity:.6}
  .a-ad .img{height:400px;background:linear-gradient(150deg,var(--sky),var(--purple));position:relative;display:flex;align-items:flex-end;padding:34px}
  .a-ad .img h3{font-family:'Newsreader',serif;font-size:64px;line-height:.9;color:var(--paper);max-width:420px}
  .a-ad .cta{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-top:1px solid rgba(40,54,59,.12)}
  .a-ad .cta span{font-size:13px;letter-spacing:.06em;opacity:.65}
  .a-ad .pill{background:var(--purple);color:var(--paper);font-size:13px;letter-spacing:.06em;padding:11px 18px;border-radius:999px}

  /* 15 Funnel */
  .a-fun{background:#1D2C32;color:var(--paper);justify-content:center}
  .a-fun h2{font-size:74px;line-height:.95;margin-bottom:64px;max-width:640px}
  .a-fun .st{height:118px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;margin-bottom:14px;color:var(--ink)}
  .a-fun .st b{font-weight:500;font-size:19px;letter-spacing:.06em}
  .a-fun .st em{font-style:normal;font-family:'Newsreader',serif;font-size:34px}
  .a-fun .s1{width:100%;background:var(--mint)}.a-fun .s2{width:76%;background:var(--sky)}.a-fun .s3{width:52%;background:var(--lilac)}

  /* ---------- overlays 1280x720 (transparent) ---------- */
  .ov{width:1280px;height:720px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:64px;color:var(--paper)}
  .ov .k{font-size:16px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;margin-bottom:22px;display:flex;align-items:center;gap:14px}
  .ov .k:before{content:"";width:44px;height:1px;background:currentColor;opacity:.6}
  .ov h2{font-family:'Newsreader',serif;font-size:120px;line-height:.86;letter-spacing:-.02em}
  .ov .rule{height:1px;background:rgba(248,247,250,.4);margin:30px 0 18px}
  .ov .b{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
  .ov .star{position:absolute;right:64px;top:64px;font-size:44px;opacity:.9}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const M = (w)=>`<svg viewBox="0 0 100 100" width="${w}" height="${w}" aria-hidden="true">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#BFE0C8"/><stop offset=".45" stop-color="#BFD3EA"/>
    <stop offset=".72" stop-color="#CBB8F0"/><stop offset="1" stop-color="#E6CBA6"/>
  </linearGradient></defs>
  <rect width="100" height="100" rx="6" fill="url(#g)"/>
  <path d="M14 14c9 14 9 30 0 44 14-9 30-9 44 0-9-14-9-30 0-44-14 9-30 9-44 0z" fill="#F8F7FA"/>
</svg>`;

const arts = {};

/* --- AUDIOVISUAL --- */
arts['audiovisual-1'] = `<div class="art a-luz">
  <div class="perf">${'<i></i>'.repeat(9)}</div>
  <div class="big serif">Luz</div>
  <div class="meta"><span>Pieza 01 — Dirección de fotografía</span><span>Campaña de marca</span></div>
</div>`;

arts['audiovisual-2'] = `<div class="art a-mov">
  <div class="blob"></div><div class="arch"></div>
  <div class="big serif it">Movimiento</div>
  <div class="foot"><span class="lbl">Rodaje · 30 s</span><span class="tiny">Color, montaje y diseño sonoro</span></div>
</div>`;

arts['audiovisual-3'] = `<div class="art a-story">
  <h2 class="serif">Guion visual</h2>
  <div class="grid">
    <div class="fr"><b>01</b><span>Plano abierto</span></div>
    <div class="fr"><b>02</b><span>Detalle</span></div>
    <div class="fr"><b>03</b><span>Retrato</span></div>
    <div class="fr"><b>04</b><span>Cierre</span></div>
  </div>
  <div class="foot"><span class="lbl">Storyboard</span><span class="tiny">4 planos · 30 s</span></div>
</div>`;

/* --- BRANDING --- */
arts['branding-1'] = `<div class="art a-mono">
  <div class="guides"></div><div class="circle"></div>
  <div class="mark">${M(420)}</div>
  <div class="tag"><span class="lbl">Construcción del símbolo</span><span class="tiny">Retícula 60 px</span></div>
</div>`;

arts['branding-2'] = `<div class="art a-pal">
  <div class="big serif">Marca</div>
  <div class="sub">con propósito</div>
  <div class="chips">
    <div class="chip"><i style="background:#28363B"></i>#28363B</div>
    <div class="chip"><i style="background:#4600BB"></i>#4600BB</div>
    <div class="chip"><i style="background:#BFE0C8"></i>#BFE0C8</div>
    <div class="chip"><i style="background:#BFD3EA"></i>#BFD3EA</div>
    <div class="chip"><i style="background:#E6CBA6"></i>#E6CBA6</div>
  </div>
</div>`;

arts['branding-3'] = `<div class="art a-stat">
  <div class="card c1">${M(64)}<div class="bars"><span style="width:70%"></span><span style="width:45%"></span><span style="width:58%"></span></div></div>
  <div class="card c2"><div class="line"></div><div class="line"></div><div class="bars"><span style="width:80%"></span><span style="width:52%"></span></div></div>
  <div class="foot" style="position:absolute;left:76px;right:76px;bottom:76px"><span class="lbl">Aplicaciones</span><span class="tiny">Papelería corporativa</span></div>
</div>`;

/* --- DISEÑO --- */
arts['diseno-1'] = `<div class="art a-sur">
  <div class="star">✦</div>
  <div class="big serif">Sur</div>
  <div class="row"><p>Afiche de campaña para temporada de verano. Tipografía editorial sobre campo de color.</p><span class="lbl">2026</span></div>
</div>`;

arts['diseno-2'] = `<div class="art a-pack">
  <div class="shelf">
    <div class="box h2"><b>01</b><span class="serif" style="font-size:26px">Origen</span></div>
    <div class="box h1"><b>02</b><span class="serif" style="font-size:34px">Temporada</span></div>
    <div class="box h3"><b>03</b><span class="serif" style="font-size:30px">Edición</span></div>
  </div>
  <div class="foot" style="width:100%"><span class="lbl">Packaging</span><span class="tiny">Sistema de tres referencias</span></div>
</div>`;

arts['diseno-3'] = `<div class="art a-edit">
  <div class="top"><span class="lbl">Editorial</span><span class="tiny">N.º 04</span></div>
  <h1 class="serif">Una marca se lee antes de escucharse.</h1>
  <div class="cols"><div class="txt"></div><div class="img"><span>Sistema editorial</span></div></div>
  <div class="foot"><span class="tiny">Diseño de catálogo y revista de marca</span><span class="lbl">12 pp.</span></div>
</div>`;

/* --- REDES --- */
arts['redes-1'] = `<div class="art a-phone">
  <div class="row">
    <div class="ph"><div class="scr"><div class="img" style="background:linear-gradient(150deg,#BFE0C8,#4600BB)"><b>Nueva<br>temporada</b></div><div class="body"><i style="width:80%"></i><i style="width:55%"></i><i style="width:68%"></i></div></div></div>
    <div class="ph"><div class="scr"><div class="img" style="background:linear-gradient(150deg,#BFD3EA,#28363B)"><b>Detrás<br>de cámara</b></div><div class="body"><i style="width:70%"></i><i style="width:88%"></i><i style="width:45%"></i></div></div></div>
    <div class="ph"><div class="scr"><div class="img" style="background:linear-gradient(150deg,#E6CBA6,#CBB8F0)"><b>Guía de<br>cuidado</b></div><div class="body"><i style="width:60%"></i><i style="width:75%"></i><i style="width:50%"></i></div></div></div>
  </div>
  <div class="foot" style="width:100%"><span class="lbl">Contenido mensual</span><span class="tiny">Piezas en 4:5 y 9:16</span></div>
</div>`;

arts['redes-2'] = `<div class="art a-grid">
  <div class="g">
    <div class="t" style="background:linear-gradient(140deg,#BFE0C8,#F8F7FA)"><em>01</em><span>Hola</span></div>
    <div class="t" style="background:linear-gradient(140deg,#4600BB,#CBB8F0)"><em style="color:#F8F7FA">02</em><span style="color:#F8F7FA">Sur</span></div>
    <div class="t" style="background:linear-gradient(140deg,#E6CBA6,#BFD3EA)"><em>03</em><span>Oficio</span></div>
